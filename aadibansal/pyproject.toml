[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-mot"
version = "1.0.0"
description = "Multi-object pedestrian tracking for dense crowds: ByteTrack, SORT, and HOTA/IDF1/CLEAR metrics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
detect = ["ultralytics>=8.1", "torch>=2.0", "opencv-python-headless>=4.8"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
cv-mot = "cv_mot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
